# Projet compose « atlas » (sprint M-bis, 17/09/2026).
# L'ancien projet implicite « assistant-bureau » (conteneurs assistant_*) n'est plus utilisé.
# Démarrage : docker compose up -d   (ChromaDB + SearXNG ; Ollama reste natif)
name: atlas

services:
  chromadb:
    # Image épinglée par digest (chroma 1.4.1). Ne pas repasser à :latest sans migration vérifiée
    # (scripts/backup_memory.py backup + verify).
    image: chromadb/chroma@sha256:7605e7b398f96dba833ed1b6272f815b9d33414dde45c68bd246e84447db8591
    container_name: atlas_chromadb
    ports:
      - "8001:8000"
    volumes:
      # L'image persiste dans /data (persist_path) : le volume doit être monté là (risque L21).
      - atlas_chromadb_data:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
      # Aucun appel `reset` ne doit pouvoir effacer la mémoire (sprint B-minimal, BM7).
      # Constaté au sprint B-minimal : le serveur 1.4.1 ignore cette variable. C'est l'absence de
      # `allow_reset: true` dans son /config.yaml qui refuse `reset` (HTTP 403). La variable est
      # gardée à FALSE pour documenter l'intention et couvrir une image qui la lirait.
      - ALLOW_RESET=FALSE
    restart: unless-stopped

  searxng:
    # Épinglée par digest comme ChromaDB (sprint C) : pas de changement de version silencieux.
    image: searxng/searxng@sha256:edf110a2816d8963949d03879c72a7e19c221b5f7bfb7952a33ae073f96ccb18
    container_name: atlas_searxng
    ports:
      - "8888:8080"
    volumes:
      - ./config/searxng:/etc/searxng
      # Volume nommé : sans lui, un volume anonyme est créé à chaque recréation du conteneur.
      - atlas_searxng_cache:/var/cache/searxng
    environment:
      # Valeur de remplacement, sans effet de sécurité réel : service local, non exposé.
      # À remplacer par un secret hors dépôt le jour où SearXNG sort de 127.0.0.1.
      - SEARXNG_SECRET_KEY=atlas_secret_key_change_me
    restart: unless-stopped

  # Ollama tourne en natif. Ce service entrait en conflit sur le port 11434 (risque L22) :
  # il ne démarre plus que sur demande explicite : docker compose --profile docker-ollama up -d
  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama
    container_name: atlas_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # Créé hors compose (sprint M-bis) : ni `docker compose down` ni `down -v` ne peuvent le supprimer.
  atlas_chromadb_data:
    external: true
  # Cache SearXNG : régénérable, géré par compose. `name:` évite le préfixe de projet.
  atlas_searxng_cache:
    name: atlas_searxng_cache
  # Volume existant de l'ancien projet (contient mistral), réutilisé tel quel.
  ollama_data:
    name: assistant-bureau_ollama_data
